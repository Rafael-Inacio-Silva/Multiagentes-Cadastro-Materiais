<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Desenho técnico SINTÉTICO, criado para o caminho de teste do MVP.
       Eixo escalonado de 250 mm: Ø40×50 + Ø60×120 + Ø50×80, aço SAE 1045. -->
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#111"/>
    </marker>
    <pattern id="hachura" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1130" fill="#fff"/>
  <rect x="20" y="20" width="1560" height="1090" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="40" y="40" width="1520" height="1050" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- linha de centro -->
  <line x1="290" y1="430" x2="1120" y2="430" stroke="#111" stroke-width="1" stroke-dasharray="28 6 4 6"/>

  <!-- perfil do eixo (vista frontal) -->
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <!-- Ø40 x 50 com chanfro 1x45° -->
    <path d="M333,370 L480,370 L480,490 L333,490 L330,487 L330,373 Z"/>
    <!-- Ø60 x 120 -->
    <rect x="480" y="340" width="360" height="180"/>
    <!-- Ø50 x 80 com chanfro 1x45° -->
    <path d="M840,355 L1077,355 L1080,358 L1080,502 L1077,505 L840,505 Z"/>
  </g>
  <!-- rasgo de chaveta no Ø40 -->
  <rect x="345" y="418" width="75" height="24" rx="12" fill="none" stroke="#111" stroke-width="2.2"/>

  <!-- cotas de diâmetro -->
  <g stroke="#111" stroke-width="1.2" fill="none">
    <line x1="465" y1="372" x2="465" y2="488" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <line x1="805" y1="342" x2="805" y2="518" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <line x1="1045" y1="357" x2="1045" y2="503" marker-start="url(#seta)" marker-end="url(#seta)"/>
  </g>
  <g font-size="22" fill="#111">
    <text x="456" y="430" text-anchor="middle" transform="rotate(-90 456 430)">Ø40 k6</text>
    <text x="796" y="430" text-anchor="middle" transform="rotate(-90 796 430)">Ø60</text>
    <text x="1036" y="430" text-anchor="middle" transform="rotate(-90 1036 430)">Ø50 h7</text>
  </g>

  <!-- linhas de chamada e cotas de comprimento -->
  <g stroke="#111" stroke-width="1" fill="none">
    <line x1="330" y1="495" x2="330" y2="665"/>
    <line x1="480" y1="525" x2="480" y2="605"/>
    <line x1="840" y1="525" x2="840" y2="605"/>
    <line x1="1080" y1="510" x2="1080" y2="665"/>
  </g>
  <g stroke="#111" stroke-width="1.2" fill="none">
    <line x1="331" y1="590" x2="479" y2="590" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <line x1="481" y1="590" x2="839" y2="590" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <line x1="841" y1="590" x2="1079" y2="590" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <line x1="331" y1="650" x2="1079" y2="650" marker-start="url(#seta)" marker-end="url(#seta)"/>
  </g>
  <g font-size="22" fill="#111" text-anchor="middle">
    <text x="405" y="580">50</text>
    <text x="660" y="580">120</text>
    <text x="960" y="580">80</text>
    <text x="705" y="640">250</text>
  </g>

  <!-- cota do rasgo de chaveta -->
  <g stroke="#111" stroke-width="1" fill="none">
    <line x1="345" y1="414" x2="345" y2="300"/>
    <line x1="420" y1="414" x2="420" y2="300"/>
    <line x1="346" y1="310" x2="419" y2="310" marker-start="url(#seta)" marker-end="url(#seta)"/>
  </g>
  <text x="382" y="300" font-size="20" fill="#111" text-anchor="middle">25</text>
  <text x="382" y="272" font-size="18" fill="#111" text-anchor="middle">CHAVETA 12×8</text>

  <!-- rugosidade -->
  <g stroke="#111" stroke-width="1.6" fill="none">
    <path d="M640,338 L676,282 L716,282"/>
    <path d="M640,338 L626,314"/>
  </g>
  <text x="686" y="276" font-size="18" fill="#111">N7</text>

  <!-- balão de posição -->
  <line x1="1080" y1="380" x2="1170" y2="300" stroke="#111" stroke-width="1"/>
  <circle cx="1190" cy="282" r="26" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="1190" y="290" font-size="22" fill="#111" text-anchor="middle">1</text>

  <!-- vista em corte do rasgo -->
  <g transform="translate(1310,430)">
    <circle r="60" fill="url(#hachura)" stroke="#111" stroke-width="2.6"/>
    <rect x="-18" y="-61" width="36" height="24" fill="#fff" stroke="#111" stroke-width="2.2"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#111" stroke-width="1" stroke-dasharray="20 5 4 5"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#111" stroke-width="1" stroke-dasharray="20 5 4 5"/>
    <text y="112" font-size="22" fill="#111" text-anchor="middle">CORTE A-A</text>
  </g>

  <!-- notas gerais -->
  <g font-size="17" fill="#111">
    <text x="70" y="900" font-weight="700">NOTAS</text>
    <text x="70" y="930">1. Chanfros não indicados 1×45°.</text>
    <text x="70" y="958">2. Tolerâncias gerais conforme ISO 2768-m.</text>
    <text x="70" y="986">3. Rugosidade geral N7, salvo indicação.</text>
    <text x="70" y="1014">4. Peça usinada a partir de barra redonda.</text>
  </g>

  <!-- carimbo -->
  <g stroke="#111" fill="none">
    <rect x="980" y="870" width="580" height="220" stroke-width="2.4"/>
    <line x1="980" y1="932" x2="1560" y2="932" stroke-width="1.4"/>
    <line x1="980" y1="980" x2="1560" y2="980" stroke-width="1.4"/>
    <line x1="980" y1="1028" x2="1560" y2="1028" stroke-width="1.4"/>
    <line x1="980" y1="1062" x2="1560" y2="1062" stroke-width="1.4"/>
    <line x1="1420" y1="932" x2="1420" y2="1028" stroke-width="1.4"/>
    <line x1="1125" y1="1028" x2="1125" y2="1062" stroke-width="1.4"/>
    <line x1="1270" y1="1028" x2="1270" y2="1062" stroke-width="1.4"/>
    <line x1="1420" y1="1028" x2="1420" y2="1062" stroke-width="1.4"/>
  </g>
  <g fill="#111">
    <text x="992" y="888" font-size="12">DENOMINAÇÃO</text>
    <text x="992" y="920" font-size="28" font-weight="700">EIXO DE TRANSMISSÃO</text>

    <text x="992" y="946" font-size="12">MATERIAL</text>
    <text x="992" y="971" font-size="21" font-weight="600">AÇO SAE 1045 · BARRA REDONDA Ø65</text>
    <text x="1432" y="946" font-size="12">QTD.</text>
    <text x="1432" y="971" font-size="21" font-weight="600">1</text>

    <text x="992" y="994" font-size="12">Nº DO DESENHO</text>
    <text x="992" y="1019" font-size="21" font-weight="600">MT-2026-0117</text>
    <text x="1432" y="994" font-size="12">REV.</text>
    <text x="1432" y="1019" font-size="21" font-weight="600">0</text>

    <text x="992" y="1041" font-size="11">ESCALA</text>
    <text x="992" y="1057" font-size="16">1:1</text>
    <text x="1137" y="1041" font-size="11">UNIDADE</text>
    <text x="1137" y="1057" font-size="16">mm</text>
    <text x="1282" y="1041" font-size="11">FOLHA</text>
    <text x="1282" y="1057" font-size="16">1/1</text>
    <text x="1432" y="1041" font-size="11">DATA</text>
    <text x="1432" y="1057" font-size="16">16/11/2026</text>

    <text x="992" y="1081" font-size="13">Desenho sintético para teste · Multiagentes Cadastro de Materiais</text>
  </g>
</svg>
